<div class="row justify-content-center">
  <div id="registerform" *ngIf="!isFetching" class="col-11 col-sm-10 col-md-6 col-lg-5 col-xl-4">
    <div class="card">
      <div class="card-header">
        <div class="row">
          <div class="col-6">
            <h3>Register</h3>
          </div>
          <div class="col-6 d-flex justify-content-end social_icon">
            <span><i class="fa fa-facebook-square"></i></span>
            <span><i class="fa fa-google-plus-square"></i></span>
          </div>
        </div>
      </div>
      <div class="card-body">
        <form #loginForm="ngForm" (ngSubmit)="register(loginForm.value)">
          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fa fa-user"></i></span>
            </div>
            <input (ngModel)="registerValues.email" [ngClass]="{ 'wrongEmail': wrongEmail }" name="email" required
              id="email" type="text" placeholder="Enter email" (keyup)="checkEmail($event)" class="form-control" />
          </div>
          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fa fa-key"></i></span>
            </div>
            <input type="password" name="password" [ngClass]="{ 'wrongEmail': wrongPassword }"
              (ngModel)="registerValues.password" required class="form-control" id="password"
              (keyup)="keyUpPassword($event)" placeholder="Enter password">
          </div>
          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fa fa-check"></i></span>
            </div>
            <input type="password" name="secondPassword" (ngModel)="registerValues.secondPassword" required
              class="form-control" (keyup)="keyUpPassword($event)" id="secondPassword" placeholder="Validate password">
          </div>
          <!--
          <div class="row align-items-center remember">
            <input type="checkbox">Remember Me
          </div>
          -->
          <div class="form-group">
            <input [disabled]="wrongEmail || wrongPassword" type="submit" value="Register"
              class="btn float-right login_btn">
          </div>
        </form>
      </div>
      <div class="card-footer">
        <div class="d-flex justify-content-center links">
          Already have an account?<a href="#" [routerLink]="['/login']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">Log in</a>
        </div>
        <div class="d-flex justify-content-center">
          <a href="#" [routerLink]="['/forgotpassword']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">Forgot your password?</a>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="isFetching">
    <app-progress-spinner></app-progress-spinner>
  </div>
</div>
<div id="errorDiv" *ngIf="error" class="col-11 col-sm-10 col-md-6 col-lg-5 col-xl-4">
  <div class="card" id="errorCard">
    <div class=" card-body">
      <h5 class="card-title">Wrong credentials.</h5>
      <p class="card-text">Please provide <span *ngIf="wrongEmail">the correct </span><span *ngIf="wrongEmail">
          email</span><span *ngIf="wrongEmail && wrongSamePassword"> and </span> <span *ngIf="wrongSamePassword">the
          same
          password</span>.</p>
    </div>
  </div>
</div>
