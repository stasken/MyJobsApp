<div class="row justify-content-center">
  <div *ngIf="!isFetching && !emailSent" id="registerform" class="col-11 col-sm-10 col-md-6 col-lg-5 col-xl-4">
    <div class="card">
      <div class="card-header">
        <div class="row">
          <div class="col-12">
            <h3>Forgot password?</h3>
          </div>
        </div>
      </div>
      <div class="card-body">
        <form #passwordForm="ngForm" (ngSubmit)="forgotpassword(passwordForm.value)">
          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fa fa-user"></i></span>
            </div>
            <input (ngModel)="registerValues.email" name="email" required id="email" type="text"
              placeholder="Enter email" (keyup)="checkEmail($event)" class="form-control" />
          </div>
          <div class="form-group">
            <input type="submit" value="Submit" class="btn float-right login_btn">
          </div>
        </form>
      </div>
      <div class="card-footer">
        <div class="d-flex justify-content-center links">
          You suddenly remember your password?<a href="#" id="loginLink" [routerLink]="['/login']"
            routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Log in</a>
        </div>
        <div class="d-flex justify-content-center">
          <a href="#" [routerLink]="['/register']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">Don't have an account?</a>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="isFetching">
    <app-progress-spinner></app-progress-spinner>
  </div>
  <div *ngIf="emailSent" class="col-11 col-sm-10 col-md-6 col-lg-5 col-xl-4">
    <div class="card" id="emailSent">
      <div class=" card-body">
        <h5 class="card-title">Email has been sent.</h5>
        <p class="card-text">Take a look at your (spam) emails to change your password.</p>
      </div>
    </div>
  </div>
