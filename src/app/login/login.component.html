<div class="row justify-content-center">
  <div id="loginform" *ngIf="!isFetching" class="col-11 col-sm-10 col-md-6 col-lg-5 col-xl-4">
    <div class="card">
      <div class="card-header">
        <div class="row">
          <div class="col-6">
            <h3>Sign In</h3>
          </div>
          <div class="col-6 d-flex justify-content-end social_icon">
            <!--
            <span><a (click)="fbLogin();"><i class="fa fa-facebook-square"></i></a></span>
            <span><i class="fa fa-google-plus-square"></i></span>
            -->
          </div>
        </div>
      </div>
      <div class="card-body">
        <form #loginForm="ngForm" (ngSubmit)="login(loginForm.value)">
          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fa fa-user"></i></span>
            </div>
            <input (ngModel)="loginValues.email" name="email" required id="email" type="text" placeholder="Enter email"
              class="form-control" />
          </div>
          <div class="input-group form-group">
            <div class="input-group-prepend">
              <span class="input-group-text"><i class="fa fa-key"></i></span>
            </div>
            <input type="password" name="password" (ngModel)="loginValues.password" required class="form-control"
              id="password" placeholder="Enter password">
          </div>
          <!--
          <div class="row align-items-center remember">
            <input type="checkbox">Remember Me
          </div>
          -->
          <div class="form-group">
            <input type="submit" value="Login" class="btn float-right login_btn">
          </div>
        </form>
      </div>
      <div class="card-footer">
        <div class="d-flex justify-content-center links">
          Don't have an account?<a href="#" [routerLink]="['/register']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">Sign Up</a>
        </div>
        <div class="d-flex justify-content-center">
          <a href="#" [routerLink]="['/forgotpassword']" routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }">Forgot your password?</a>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="isFetching">
    <app-progress-spinner></app-progress-spinner>
  </div>
</div>
<div class="row justify-content-center">
  <div *ngIf="error" class="col-11 col-sm-10 col-md-6 col-lg-5 col-xl-4">
    <div class="card" id="errorCard">
      <div class=" card-body">
        <h5 class="card-title">Wrong credentials.</h5>
        <p class="card-text">Please provide the correct email and password.</p>
      </div>
    </div>
  </div>
</div>
